<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="google" value="notranslate">
        <meta
            name="description"
            content="Computer Vision Annotation Tool (CVAT) is a free, open source, web-based image and video annotation tool which is used for labeling data for computer vision algorithms. CVAT supports the primary tasks of supervised machine learning: object detection, image classification, and image segmentation. CVAT allows users to annotate data for each of these cases"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&family=Sora&display=swap" rel="stylesheet">
        <title>Computer Vision Annotation Tool</title>
        <script>
            // Paints the dark background before the bundle runs so dark mode users
            // do not see a white flash. Only the root element is touched, because
            // document.body does not exist yet; the body class is added by the app.
            (function () {
                try {
                    var settings = localStorage.getItem('clientSettings');
                    if (!settings) {
                        return;
                    }
                    var parsed = JSON.parse(settings);
                    if (parsed.appearance && parsed.appearance.darkMode) {
                        document.documentElement.style.colorScheme = 'dark';
                        document.documentElement.style.backgroundColor = '#141414';
                    }
                } catch (e) {}
            })();
        </script>
    </head>
    <body translate="no">
        <div id="root"></div>
        <div id="layout-grid"></div>
    </body>
</html>

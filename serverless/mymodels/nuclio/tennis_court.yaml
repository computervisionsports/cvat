spec:
  description: YOLO-pose tennis court keypoints via the CVAT inference API
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat.mymodels.yolo-tennis-court-keypoints
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: |-
            apt-get update \
            && apt-get install -y --no-install-recommends \
              python-is-python3 \
              python3 \
              python3-pip \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install requests pyyaml --no-cache-dir
        # Nuclio finishes the build with an offline `pip install nuclio-sdk
        # msgpack --no-index`, but its onbuild images ship x86_64 msgpack wheels
        # only, so that step fails on arm64 hosts. Seeding a wheel built for the
        # base image's architecture makes the offline install resolvable.
        - kind: RUN
          value: pip download msgpack==1.1.0 --no-deps --dest /opt/nuclio/whl

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

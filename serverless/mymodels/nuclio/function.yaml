metadata:
  name: rfdetr-scoreboards
  namespace: cvat
  annotations:
    name: RF-DETR Scoreboards and Parts
    framework: ONNX Runtime API
    type: detector
    spec: |
      [
        { "id": 0, "name": "cornerbug", "type": "rectangle" },
        { "id": 1, "name": "down_and_distance", "type": "rectangle" },
        { "id": 2, "name": "game_clock", "type": "rectangle" },
        { "id": 3, "name": "game_period", "type": "rectangle" },
        { "id": 4, "name": "logo_team_A", "type": "rectangle" },
        { "id": 5, "name": "logo_team_B", "type": "rectangle" },
        { "id": 6, "name": "play_clock", "type": "rectangle" },
        { "id": 7, "name": "random_logo", "type": "rectangle" },
        { "id": 8, "name": "record_team_A", "type": "rectangle" },
        { "id": 9, "name": "record_team_B", "type": "rectangle" },
        { "id": 10, "name": "score_team_A", "type": "rectangle" },
        { "id": 11, "name": "score_team_B", "type": "rectangle" },
        {
          "id": 12,
          "name": "scoreboard",
          "type": "rectangle",
          "attributes": [
            {
              "name": "broadcaster",
              "input_type": "select",
              "values": [
                "Amazon_Prime",
                "CBS",
                "ESPN",
                "FOX",
                "NBC",
                "NFL_ESPN2",
                "NFL_Network",
                "netflix"
              ]
            }
          ]
        },
        { "id": 13, "name": "team_name_A", "type": "rectangle" },
        { "id": 14, "name": "team_name_B", "type": "rectangle" }
      ]
spec:
  description: RF-DETR scoreboard detector via the CVAT inference API
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat.mymodels.rfdetr-scoreboards
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: |-
            apt-get update \
            && apt-get install -y --no-install-recommends \
              python-is-python3 \
              python3 \
              python3-pip \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install requests pyyaml --no-cache-dir
        # Nuclio finishes the build with an offline `pip install nuclio-sdk
        # msgpack --no-index`, but its onbuild images ship x86_64 msgpack wheels
        # only, so that step fails on arm64 hosts. Seeding a wheel built for the
        # base image's architecture makes the offline install resolvable.
        - kind: RUN
          value: pip download msgpack==1.1.0 --no-deps --dest /opt/nuclio/whl

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
